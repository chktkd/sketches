# Commit message linting (handled by GitHub Actions)
# Note: Commitlint is used in GitHub Actions instead of pre-commit
# to avoid dependency on Node.js in local development
# - repo: https://github.com/commitizen-tools/commitizen
#   rev: v3.13.0
#   hooks:
#     - id: commitizen
#       stages: [commit-msg]

# Configuration
default_language_version:
  python: python3

# Global excludes
exclude: |
  (?x)^(
      \.git/|
      \.tox/|
      \.venv/|
      venv/|
      \.eggs/|
      \.egg-info/|
      _build/|
      build/|
      dist/|
      node_modules/|
      bower_components/|
      \.pytest_cache/|
      \.mypy_cache/|
      __pycache__/
  )

# CI settings
ci:
  autofix_commit_msg: 'ci: auto fixes from pre-commit hooks'
  autofix_prs: true
  autoupdate_commit_msg: 'ci: pre-commit autoupdate'
  autoupdate_schedule: weekly
